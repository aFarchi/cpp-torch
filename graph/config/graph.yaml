nodes:
  data:
    node_builder:
      _target_: anemoi.graphs.nodes.ReducedGaussianGridNodes
      grid: o16
    #node_builder:
    #  _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
    #  dataset: /Users/daaf/tmp/anemoi-tests/dataset/aifs-ea-an-oper-0001-mars-o32-2020-2021-6h-v1.zarr
    #attributes:
    #  weights:
    #    _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights
    #    norm: unit-max
  hidden:
    node_builder:
      _target_: anemoi.graphs.nodes.TriNodes
      resolution: 3

edges:
  - source_name: data
    target_name: hidden
    edge_builders:
      - _target_: anemoi.graphs.edges.KNNEdges
        num_nearest_neighbours: 12
    #attributes: ${attributes.edges}
  - source_name: hidden
    target_name: hidden
    edge_builders:
      - _target_: anemoi.graphs.edges.MultiScaleEdges
        x_hops: 1
    #attributes: ${attributes.edges}
  - source_name: hidden
    target_name: data
    edge_builders:
      - _target_: anemoi.graphs.edges.KNNEdges
        num_nearest_neighbours: 3
    #attributes: ${attributes.edges}

attributes:
  nodes:
    area_weight:
      _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights
      norm: unit-max
  edges:
    edge_dirs:
      _target_: anemoi.graphs.edges.attributes.EdgeDirection
      norm: unit-std
    edge_length:
      _target_: anemoi.graphs.edges.attributes.EdgeLength
      norm: unit-max

